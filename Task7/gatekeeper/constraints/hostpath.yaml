apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sSecurityRules
metadata:
  name: enforce-security-rules
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces:
      - "audit-zone"
  parameters:
    message: "Violation of security rules"