apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: requireReadOnlyRootFS
spec:
  crd:
    spec:
      names:
        kind: RequireReadOnlyRootFS
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package requireReadOnlyRootFS
        
        violation[{"msg": msg}] {
            container := input.review.object.spec.containers[_]
            not container.securityContext.readOnlyRootFilesystem == true
            msg := sprintf("Container must have readOnlyRootFilesystem: true", [container.name])
        }
        
        violation[{"msg": msg}] {
            container := input.review.object.spec.initContainers[_]
            not container.securityContext.readOnlyRootFilesystem == true
            msg := sprintf("InitContainer must have readOnlyRootFilesystem: true", [container.name])
        }